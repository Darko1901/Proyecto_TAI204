<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
    <linearGradient id="mirror" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#d0e8ff"/><stop offset="100%" style="stop-color:#a0c0e0"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Espejo lateral / Side mirror -->
  <!-- Carcasa -->
  <path d="M140,140 Q130,140 125,160 L120,260 Q120,280 140,285 L250,285 Q270,280 275,260 L280,180 Q280,150 260,140 Z" fill="#333" stroke="#222" stroke-width="2"/>
  <!-- Superficie del espejo -->
  <path d="M150,155 L150,270 Q150,278 160,278 L240,278 Q250,278 253,270 L260,170 Q260,158 250,155 Z" fill="url(#mirror)" stroke="#aaa" stroke-width="1"/>
  <!-- Reflejo -->
  <line x1="170" y1="180" x2="230" y2="170" stroke="#cce0ff" stroke-width="2" opacity="0.5"/>
  <line x1="165" y1="210" x2="240" y2="200" stroke="#cce0ff" stroke-width="2" opacity="0.5"/>
  <!-- Base de montaje -->
  <rect x="160" y="285" width="80" height="20" rx="4" fill="#444"/>
  <rect x="185" y="305" width="30" height="25" rx="3" fill="#555"/>
  <!-- Indicador LED -->
  <path d="M145,265 L155,268 L155,250 L145,247 Z" fill="#ff9900" opacity="0.7"/>
</svg>
