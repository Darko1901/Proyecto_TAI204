<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4e4"/>
      <stop offset="100%" style="stop-color:#f8d7d7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Disco exterior -->
  <circle cx="200" cy="200" r="130" fill="url(#metal)" stroke="#666" stroke-width="3"/>
  <!-- Ventilación ranuras -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8,4"/>
  <circle cx="200" cy="200" r="95" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="6,6"/>
  <!-- Centro -->
  <circle cx="200" cy="200" r="50" fill="#888" stroke="#666" stroke-width="2"/>
  <circle cx="200" cy="200" r="35" fill="#aaa"/>
  <!-- Tornillos -->
  <circle cx="200" cy="175" r="5" fill="#555"/>
  <circle cx="223" cy="188" r="5" fill="#555"/>
  <circle cx="215" cy="215" r="5" fill="#555"/>
  <circle cx="185" cy="215" r="5" fill="#555"/>
  <circle cx="177" cy="188" r="5" fill="#555"/>
  <!-- Ranuras de ventilación -->
  <line x1="160" y1="100" x2="175" y2="140" stroke="#aaa" stroke-width="2"/>
  <line x1="240" y1="100" x2="225" y2="140" stroke="#aaa" stroke-width="2"/>
  <line x1="120" y1="160" x2="155" y2="170" stroke="#aaa" stroke-width="2"/>
  <line x1="280" y1="160" x2="245" y2="170" stroke="#aaa" stroke-width="2"/>
  <line x1="120" y1="240" x2="155" y2="230" stroke="#aaa" stroke-width="2"/>
  <line x1="280" y1="240" x2="245" y2="230" stroke="#aaa" stroke-width="2"/>
  <line x1="160" y1="300" x2="175" y2="260" stroke="#aaa" stroke-width="2"/>
  <line x1="240" y1="300" x2="225" y2="260" stroke="#aaa" stroke-width="2"/>
</svg>
