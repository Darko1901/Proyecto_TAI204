<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4e4"/>
      <stop offset="100%" style="stop-color:#f8d7d7"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#444"/>
      <stop offset="50%" style="stop-color:#666"/>
      <stop offset="100%" style="stop-color:#444"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Booster circular -->
  <circle cx="200" cy="200" r="120" fill="url(#body)" stroke="#333" stroke-width="3"/>
  <circle cx="200" cy="200" r="100" fill="#555" stroke="#444" stroke-width="2"/>
  <!-- Detalle central -->
  <circle cx="200" cy="200" r="30" fill="#777" stroke="#666" stroke-width="2"/>
  <circle cx="200" cy="200" r="15" fill="#888"/>
  <!-- Conexión manguera vacío -->
  <rect x="195" y="75" width="10" height="20" rx="2" fill="#777"/>
  <circle cx="200" cy="70" r="7" fill="#888" stroke="#666" stroke-width="1.5"/>
  <!-- Varilla del pedal -->
  <rect x="196" y="310" width="8" height="50" fill="#888"/>
  <rect x="190" y="355" width="20" height="12" rx="3" fill="#777"/>
  <!-- Tornillos montaje -->
  <circle cx="140" cy="140" r="6" fill="#888"/>
  <circle cx="260" cy="140" r="6" fill="#888"/>
  <circle cx="140" cy="260" r="6" fill="#888"/>
  <circle cx="260" cy="260" r="6" fill="#888"/>
</svg>
