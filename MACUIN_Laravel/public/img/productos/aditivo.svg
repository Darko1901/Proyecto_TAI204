<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
    <linearGradient id="aditivo" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#ff7043"/><stop offset="100%" style="stop-color:#e64a19"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Aditivo para motor / Engine additive -->
  <!-- Botella más pequeña -->
  <rect x="155" y="140" width="70" height="160" rx="8" fill="url(#aditivo)" stroke="#bf360c" stroke-width="2"/>
  <!-- Cuello -->
  <rect x="175" y="115" width="30" height="30" rx="5" fill="url(#aditivo)" stroke="#bf360c" stroke-width="2"/>
  <!-- Tapa puntuda -->
  <polygon points="180,100 200,80 220,100" fill="#bf360c" stroke="#7f1700" stroke-width="1.5"/>
  <!-- Etiqueta -->
  <rect x="163" y="185" width="54" height="70" rx="3" fill="white" opacity="0.9"/>
  <text x="190" y="205" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#333" text-anchor="middle">ENGINE</text>
  <text x="190" y="220" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#e64a19" text-anchor="middle">FUEL</text>
  <text x="190" y="237" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#e64a19" text-anchor="middle">SYSTEM</text>
  <text x="190" y="250" font-family="Arial,sans-serif" font-size="7" fill="#666" text-anchor="middle">CLEANER</text>
  <!-- Gota -->
  <path d="M275,140 Q280,155 275,165 Q270,175 265,165 Q260,155 265,140 Z" fill="#e64a19" opacity="0.7"/>
  <!-- Flechas (performance) -->
  <polygon points="270,195 280,180 290,195" fill="none" stroke="#e64a19" stroke-width="2"/>
  <polygon points="270,210 280,195 290,210" fill="none" stroke="#e64a19" stroke-width="2"/>
  <!-- Medida -->
  <text x="190" y="325" font-family="Arial,sans-serif" font-size="11" fill="#999" text-anchor="middle">354 ml</text>
</svg>
