<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Sensor MAF / Mass Air Flow sensor -->
  <!-- Cuerpo del sensor (tubo) -->
  <rect x="80" y="160" width="240" height="80" rx="10" fill="#555" stroke="#444" stroke-width="2"/>
  <!-- Interior del ducto -->
  <ellipse cx="90" cy="200" rx="10" ry="35" fill="#444"/>
  <ellipse cx="310" cy="200" rx="10" ry="35" fill="#444"/>
  <!-- Rejilla interior -->
  <line x1="120" y1="170" x2="120" y2="230" stroke="#666" stroke-width="1.5"/>
  <line x1="150" y1="170" x2="150" y2="230" stroke="#666" stroke-width="1.5"/>
  <line x1="180" y1="170" x2="180" y2="230" stroke="#666" stroke-width="1.5"/>
  <line x1="210" y1="170" x2="210" y2="230" stroke="#666" stroke-width="1.5"/>
  <line x1="240" y1="170" x2="240" y2="230" stroke="#666" stroke-width="1.5"/>
  <line x1="270" y1="170" x2="270" y2="230" stroke="#666" stroke-width="1.5"/>
  <!-- Módulo electrónico (parte superior) -->
  <rect x="160" y="120" width="80" height="40" rx="5" fill="#333" stroke="#222" stroke-width="2"/>
  <!-- Conector -->
  <rect x="175" y="95" width="50" height="30" rx="5" fill="#444" stroke="#333" stroke-width="1.5"/>
  <!-- Pines -->
  <rect x="185" y="90" width="5" height="10" rx="1" fill="#888"/>
  <rect x="195" y="90" width="5" height="10" rx="1" fill="#888"/>
  <rect x="205" y="90" width="5" height="10" rx="1" fill="#888"/>
  <rect x="215" y="90" width="5" height="10" rx="1" fill="#888"/>
  <!-- Tornillos de montaje -->
  <circle cx="100" cy="245" r="6" fill="#666" stroke="#555" stroke-width="1"/>
  <circle cx="300" cy="245" r="6" fill="#666" stroke="#555" stroke-width="1"/>
  <!-- Flecha de flujo -->
  <path d="M130,280 L270,280" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>
  <polygon points="270,275 285,280 270,285" fill="#999"/>
  <text x="200" y="300" font-family="Arial,sans-serif" font-size="10" fill="#999" text-anchor="middle">AIR FLOW →</text>
</svg>
