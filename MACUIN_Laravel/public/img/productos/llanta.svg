<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#ccc"/><stop offset="70%" style="stop-color:#aaa"/><stop offset="100%" style="stop-color:#888"/></radialGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Llanta / Tire -->
  <!-- Neumático exterior -->
  <circle cx="200" cy="200" r="140" fill="#222" stroke="#111" stroke-width="3"/>
  <!-- Pared del neumático -->
  <circle cx="200" cy="200" r="120" fill="#333" stroke="#222" stroke-width="2"/>
  <!-- Rin -->
  <circle cx="200" cy="200" r="90" fill="url(#rim)" stroke="#999" stroke-width="2"/>
  <!-- Rayos del rin -->
  <line x1="200" y1="120" x2="200" y2="170" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <line x1="276" y1="160" x2="240" y2="192" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <line x1="276" y1="240" x2="240" y2="208" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <line x1="200" y1="280" x2="200" y2="230" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <line x1="124" y1="240" x2="160" y2="208" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <line x1="124" y1="160" x2="160" y2="192" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <!-- Centro del rin -->
  <circle cx="200" cy="200" r="25" fill="#bbb" stroke="#999" stroke-width="2"/>
  <!-- Tuercas -->
  <circle cx="200" cy="182" r="5" fill="#999" stroke="#888" stroke-width="1"/>
  <circle cx="217" y="194" cx="217" cy="194" r="5" fill="#999" stroke="#888" stroke-width="1"/>
  <circle cx="211" cy="214" r="5" fill="#999" stroke="#888" stroke-width="1"/>
  <circle cx="189" cy="214" r="5" fill="#999" stroke="#888" stroke-width="1"/>
  <circle cx="183" cy="194" r="5" fill="#999" stroke="#888" stroke-width="1"/>
  <!-- Banda de rodamiento -->
  <circle cx="200" cy="200" r="135" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="8 6"/>
</svg>
