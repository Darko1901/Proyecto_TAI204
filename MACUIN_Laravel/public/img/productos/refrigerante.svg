<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
    <linearGradient id="coolant" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#29b6f6"/><stop offset="100%" style="stop-color:#0288d1"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Refrigerante / Coolant -->
  <!-- Galón -->
  <rect x="110" y="140" width="130" height="170" rx="10" fill="url(#coolant)" stroke="#01579b" stroke-width="2"/>
  <!-- Cuello -->
  <rect x="155" y="110" width="40" height="35" rx="5" fill="url(#coolant)" stroke="#01579b" stroke-width="2"/>
  <!-- Tapa -->
  <rect x="160" y="95" width="30" height="20" rx="4" fill="#01579b" stroke="#002f6c" stroke-width="1.5"/>
  <!-- Manija -->
  <path d="M240,155 Q270,155 270,185 L270,245 Q270,260 255,260 L240,260" fill="none" stroke="#01579b" stroke-width="7"/>
  <!-- Etiqueta -->
  <rect x="120" y="195" width="110" height="75" rx="5" fill="white" opacity="0.9"/>
  <text x="175" y="218" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">COOLANT</text>
  <text x="175" y="237" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0288d1" text-anchor="middle">50/50</text>
  <text x="175" y="255" font-family="Arial,sans-serif" font-size="9" fill="#666" text-anchor="middle">-37°C / 129°C</text>
  <!-- Copo de nieve -->
  <text x="280" y="155" font-family="Arial,sans-serif" font-size="24" fill="#0288d1">❄</text>
  <!-- Nivel de líquido visible -->
  <rect x="113" y="260" width="124" height="45" rx="8" fill="#0277bd" opacity="0.3"/>
</svg>
