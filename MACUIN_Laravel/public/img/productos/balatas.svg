  <line x1="135" y1="175" x2="265" y2="175" stroke="#888" stroke-width="1"/>
  <line x1="135" y1="190" x2="265" y2="190" stroke="#888" stroke-width="1"/>
  <line x1="135" y1="200" x2="265" y2="200" stroke="#888" stroke-width="1"/>
  <!-- Ranura indicadora -->
