<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
    <linearGradient id="dot4" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#ffd54f"/><stop offset="100%" style="stop-color:#ffb300"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Líquido de frenos DOT 4 -->
  <!-- Botella -->
  <rect x="150" y="130" width="80" height="180" rx="10" fill="url(#dot4)" stroke="#ff8f00" stroke-width="2"/>
  <!-- Cuello -->
  <rect x="175" y="105" width="30" height="30" rx="5" fill="url(#dot4)" stroke="#ff8f00" stroke-width="2"/>
  <!-- Tapa -->
  <rect x="178" y="90" width="24" height="20" rx="4" fill="#e65100" stroke="#bf360c" stroke-width="1.5"/>
  <!-- Etiqueta -->
  <rect x="158" y="180" width="64" height="80" rx="4" fill="white" opacity="0.9"/>
  <text x="190" y="202" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">BRAKE</text>
  <text x="190" y="218" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">FLUID</text>
  <text x="190" y="242" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#e65100" text-anchor="middle">DOT 4</text>
  <!-- Warning triangle -->
  <polygon points="280,140 295,170 265,170" fill="none" stroke="#e65100" stroke-width="2"/>
  <text x="280" y="166" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">!</text>
  <!-- Medida -->
  <text x="190" y="330" font-family="Arial,sans-serif" font-size="11" fill="#999" text-anchor="middle">500 ml</text>
</svg>
