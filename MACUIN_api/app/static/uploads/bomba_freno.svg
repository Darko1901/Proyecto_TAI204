<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4e4"/>
      <stop offset="100%" style="stop-color:#f8d7d7"/>
    </linearGradient>
    <linearGradient id="cylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#777"/>
      <stop offset="50%" style="stop-color:#bbb"/>
      <stop offset="100%" style="stop-color:#777"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Cilindro maestro cuerpo -->
  <rect x="100" y="150" width="200" height="60" rx="10" fill="url(#cylinder)" stroke="#555" stroke-width="2"/>
  <!-- Depósito -->
  <rect x="130" y="110" width="60" height="45" rx="5" fill="#444" stroke="#333" stroke-width="2"/>
  <rect x="138" y="115" width="44" height="20" rx="3" fill="#555"/>
  <!-- Tapa depósito -->
  <rect x="135" y="100" width="50" height="14" rx="5" fill="#333"/>
  <!-- Pistón -->
  <rect x="290" y="163" width="50" height="34" rx="3" fill="#888" stroke="#666" stroke-width="1.5"/>
  <rect x="335" y="168" width="20" height="24" rx="2" fill="#999"/>
  <!-- Conexiones -->
  <circle cx="120" cy="215" r="8" fill="#666" stroke="#555" stroke-width="1.5"/>
  <circle cx="160" cy="215" r="8" fill="#666" stroke="#555" stroke-width="1.5"/>
  <!-- Detalles -->
  <rect x="220" y="155" width="3" height="50" fill="#999"/>
  <rect x="250" y="155" width="3" height="50" fill="#999"/>
</svg>
