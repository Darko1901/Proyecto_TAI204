<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Bieleta - barra central -->
  <rect x="155" y="100" width="12" height="200" rx="4" fill="#888" stroke="#666" stroke-width="1.5" transform="rotate(15, 200, 200)"/>
  <!-- Rótula superior -->
  <circle cx="175" cy="108" r="16" fill="#777" stroke="#555" stroke-width="2"/>
  <circle cx="175" cy="108" r="8" fill="#888"/>
  <!-- Rótula inferior -->
  <circle cx="225" cy="292" r="16" fill="#777" stroke="#555" stroke-width="2"/>
  <circle cx="225" cy="292" r="8" fill="#888"/>
  <!-- Guardapolvos -->
  <ellipse cx="175" cy="125" rx="12" ry="8" fill="#333"/>
  <ellipse cx="225" cy="275" rx="12" ry="8" fill="#333"/>
  <!-- Roscas -->
  <rect x="169" y="88" width="12" height="12" fill="#aaa" stroke="#888" stroke-width="0.5"/>
  <rect x="219" y="300" width="12" height="12" fill="#aaa" stroke="#888" stroke-width="0.5"/>
</svg>
