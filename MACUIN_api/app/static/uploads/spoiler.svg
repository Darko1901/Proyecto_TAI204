    <linearGradient id="carbon" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#333"/><stop offset="50%" style="stop-color:#444"/><stop offset="100%" style="stop-color:#333"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Spoiler trasero -->
