<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4e4"/>
      <stop offset="100%" style="stop-color:#f8d7d7"/>
    </linearGradient>
    <linearGradient id="tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#333"/>
      <stop offset="40%" style="stop-color:#555"/>
      <stop offset="100%" style="stop-color:#333"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#aaa"/>
      <stop offset="50%" style="stop-color:#eee"/>
      <stop offset="100%" style="stop-color:#aaa"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Tubo exterior (negro) -->
  <rect x="185" y="60" width="30" height="180" rx="5" fill="url(#tube)" stroke="#222" stroke-width="2"/>
  <!-- Vástago cromado -->
  <rect x="190" y="200" width="20" height="140" rx="3" fill="url(#chrome)" stroke="#888" stroke-width="1"/>
  <!-- Ojo superior -->
  <rect x="180" y="45" width="40" height="25" rx="5" fill="#444" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="57" r="7" fill="#fce4e4" stroke="#333" stroke-width="2"/>
  <!-- Base inferior -->
  <rect x="175" y="335" width="50" height="20" rx="4" fill="#555" stroke="#333" stroke-width="2"/>
  <rect x="185" y="350" width="30" height="15" rx="3" fill="#666"/>
  <!-- Resorte -->
  <path d="M170,110 Q230,120 170,135 Q230,150 170,165 Q230,180 170,195 Q230,210 170,225" fill="none" stroke="#e57373" stroke-width="4"/>
  <!-- Etiqueta marca -->
  <rect x="178" y="130" width="44" height="18" rx="3" fill="#cc3333"/>
  <text x="200" y="143" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">MONROE</text>
</svg>
