<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
    <linearGradient id="psf" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#ab47bc"/><stop offset="100%" style="stop-color:#7b1fa2"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Líquido de dirección hidráulica / Power steering fluid -->
  <rect x="150" y="130" width="80" height="180" rx="10" fill="url(#psf)" stroke="#4a148c" stroke-width="2"/>
  <rect x="175" y="105" width="30" height="30" rx="5" fill="url(#psf)" stroke="#4a148c" stroke-width="2"/>
  <rect x="178" y="90" width="24" height="20" rx="4" fill="#4a148c" stroke="#2a0060" stroke-width="1.5"/>
  <!-- Etiqueta -->
  <rect x="158" y="180" width="64" height="80" rx="4" fill="white" opacity="0.9"/>
  <text x="190" y="200" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#333" text-anchor="middle">POWER</text>
  <text x="190" y="215" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#333" text-anchor="middle">STEERING</text>
  <text x="190" y="235" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#7b1fa2" text-anchor="middle">PSF</text>
  <text x="190" y="252" font-family="Arial,sans-serif" font-size="8" fill="#666" text-anchor="middle">ATF+4</text>
  <!-- Steering wheel icon -->
  <circle cx="280" cy="155" r="18" fill="none" stroke="#7b1fa2" stroke-width="2.5"/>
  <circle cx="280" cy="155" r="5" fill="#7b1fa2"/>
  <line x1="280" y1="142" x2="280" y2="150" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="268" y1="165" x2="275" y2="160" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="292" y1="165" x2="285" y2="160" stroke="#7b1fa2" stroke-width="2"/>
</svg>
