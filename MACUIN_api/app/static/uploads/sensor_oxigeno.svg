  <line x1="182" y1="175" x2="218" y2="175" stroke="#888" stroke-width="0.8"/>
  <line x1="182" y1="180" x2="218" y2="180" stroke="#888" stroke-width="0.8"/>
  <line x1="182" y1="185" x2="218" y2="185" stroke="#888" stroke-width="0.8"/>
  <line x1="182" y1="190" x2="218" y2="190" stroke="#888" stroke-width="0.8"/>
  <line x1="182" y1="195" x2="218" y2="195" stroke="#888" stroke-width="0.8"/>
  <line x1="182" y1="200" x2="218" y2="200" stroke="#888" stroke-width="0.8"/>
</svg>
