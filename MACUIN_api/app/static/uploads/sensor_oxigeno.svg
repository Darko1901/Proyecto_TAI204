  <rect x="190" y="210" width="20" height="35" rx="3" fill="#777" stroke="#666" stroke-width="1.5"/>
  <rect x="193" y="245" width="14" height="15" rx="7" fill="#666"/>
  <!-- Perforaciones -->
  <circle cx="197" cy="250" r="2" fill="#555"/>
  <circle cx="203" cy="250" r="2" fill="#555"/>
  <!-- Cuerpo superior -->
  <rect x="188" y="120" width="24" height="40" rx="4" fill="#555" stroke="#444" stroke-width="1.5"/>
  <!-- Cable -->
  <path d="M200,120 L200,90 Q200,75 215,75 L280,75" fill="none" stroke="#333" stroke-width="4"/>
