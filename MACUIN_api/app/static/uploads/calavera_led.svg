<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Carcasa calavera -->
  <path d="M80,120 L320,120 L330,300 Q200,320 70,300 Z" fill="#222" stroke="#111" stroke-width="2"/>
  <!-- Lente roja -->
  <path d="M95,130 L305,130 L313,290 Q200,305 87,290 Z" fill="#cc0000" opacity="0.8"/>
  <!-- LED strips -->
  <rect x="110" y="150" width="180" height="8" rx="4" fill="#ff3333"/>
  <rect x="110" y="170" width="180" height="8" rx="4" fill="#ff3333"/>
  <rect x="110" y="190" width="180" height="8" rx="4" fill="#ff3333"/>
  <!-- Reversa (blanca) -->
  <rect x="130" y="230" width="60" height="40" rx="5" fill="#fff" opacity="0.8" stroke="#ddd" stroke-width="1"/>
  <!-- Direccional (ámbar) -->
  <rect x="210" y="230" width="60" height="40" rx="5" fill="#ff8800" opacity="0.7" stroke="#cc6600" stroke-width="1"/>
  <!-- Efecto LED -->
  <circle cx="160" cy="250" r="10" fill="#ffffffaa"/>
  <circle cx="240" cy="250" r="10" fill="#ffaa00" opacity="0.5"/>
</svg>
