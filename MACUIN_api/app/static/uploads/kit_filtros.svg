<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Kit de filtros - caja con 3 filtros -->
  <rect x="80" y="130" width="240" height="190" rx="8" fill="#e8e8e8" stroke="#ccc" stroke-width="2"/>
  <rect x="80" y="130" width="240" height="30" rx="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="200" y="150" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">KIT DE FILTROS</text>
  <!-- Filtro de aceite (cilíndrico) -->
  <rect x="100" y="180" width="50" height="70" rx="6" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <ellipse cx="125" cy="180" rx="25" ry="8" fill="#1976d2"/>
  <text x="125" y="220" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">ACEITE</text>
  <!-- Filtro de aire (rectangular) -->
  <rect x="165" y="180" width="70" height="35" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="170" y="185" width="60" height="25" rx="5" fill="#fffde7" stroke="#eee" stroke-width="1"/>
  <text x="200" y="235" font-family="Arial,sans-serif" font-size="8" fill="#999" text-anchor="middle">AIRE</text>
  <!-- Filtro de cabina -->
  <rect x="250" y="180" width="55" height="35" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <line x1="260" y1="183" x2="260" y2="212" stroke="#c8e6c9" stroke-width="2"/>
  <line x1="270" y1="183" x2="270" y2="212" stroke="#c8e6c9" stroke-width="2"/>
  <line x1="280" y1="183" x2="280" y2="212" stroke="#c8e6c9" stroke-width="2"/>
  <line x1="290" y1="183" x2="290" y2="212" stroke="#c8e6c9" stroke-width="2"/>
  <text x="277" y="235" font-family="Arial,sans-serif" font-size="8" fill="#999" text-anchor="middle">CABINA</text>
  <!-- Filtro de gasolina -->
  <rect x="150" y="255" width="100" height="30" rx="5" fill="#aaa" stroke="#999" stroke-width="1.5"/>
  <circle cx="155" cy="270" r="8" fill="#888"/>
  <circle cx="245" cy="270" r="8" fill="#888"/>
  <text x="200" y="273" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle">GASOLINA</text>
</svg>
