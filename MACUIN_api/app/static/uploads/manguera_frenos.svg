<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4e4"/>
      <stop offset="100%" style="stop-color:#f8d7d7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Manguera flexible -->
  <path d="M180,80 C180,120 160,140 160,180 C160,220 180,240 180,280 C180,300 170,320 170,340" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round"/>
  <!-- Refuerzo malla (patrón) -->
  <path d="M180,80 C180,120 160,140 160,180 C160,220 180,240 180,280 C180,300 170,320 170,340" fill="none" stroke="#555" stroke-width="10" stroke-dasharray="3,3"/>
  <!-- Conexión superior -->
  <rect x="168" y="65" width="24" height="25" rx="3" fill="#888" stroke="#666" stroke-width="2"/>
  <rect x="172" y="55" width="16" height="15" rx="2" fill="#999"/>
  <!-- Conexión inferior -->
  <rect x="158" y="335" width="24" height="25" rx="3" fill="#888" stroke="#666" stroke-width="2"/>
  <rect x="162" y="355" width="16" height="15" rx="2" fill="#999"/>
  <!-- Segunda manguera -->
  <path d="M250,100 C250,140 230,160 230,200 C230,240 250,260 250,300" fill="none" stroke="#333" stroke-width="10" stroke-linecap="round"/>
  <path d="M250,100 C250,140 230,160 230,200 C230,240 250,260 250,300" fill="none" stroke="#555" stroke-width="8" stroke-dasharray="3,3"/>
  <rect x="238" y="85" width="24" height="20" rx="3" fill="#888" stroke="#666" stroke-width="1.5"/>
  <rect x="238" y="295" width="24" height="20" rx="3" fill="#888" stroke="#666" stroke-width="1.5"/>
</svg>
