<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4e4"/>
      <stop offset="100%" style="stop-color:#f8d7d7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Brazo horquilla (triangular) -->
  <path d="M100,180 L300,160 L250,280 Z" fill="#555" stroke="#444" stroke-width="3"/>
  <path d="M115,185 L285,168 L242,270 Z" fill="#666"/>
  <!-- Rótula en punta -->
  <circle cx="250" cy="280" r="18" fill="#777" stroke="#555" stroke-width="2"/>
  <circle cx="250" cy="280" r="10" fill="#888"/>
  <!-- Guardapolvo rótula -->
  <path d="M235,265 Q250,250 265,265" fill="#333" stroke="#222" stroke-width="1.5"/>
  <!-- Bujes -->
  <circle cx="110" cy="185" r="15" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="110" cy="185" r="7" fill="#555"/>
  <!-- Tornillos -->
  <circle cx="280" cy="170" r="6" fill="#888"/>
  <!-- Refuerzo -->
  <rect x="140" y="195" width="80" height="8" rx="3" fill="#777" transform="rotate(-5, 180, 199)"/>
</svg>
