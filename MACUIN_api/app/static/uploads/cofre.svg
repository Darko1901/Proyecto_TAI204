<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
    <linearGradient id="hood" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#555"/><stop offset="100%" style="stop-color:#333"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Cofre / Hood panel - vista isométrica -->
  <path d="M70,250 L200,120 L330,250 L200,290 Z" fill="url(#hood)" stroke="#222" stroke-width="2"/>
  <!-- Líneas de contorno -->
  <line x1="200" y1="135" x2="200" y2="275" stroke="#444" stroke-width="1" opacity="0.5"/>
  <!-- Bisagras -->
  <rect x="130" y="230" width="20" height="8" rx="2" fill="#666"/>
  <rect x="250" y="230" width="20" height="8" rx="2" fill="#666"/>
  <!-- Entradas de aire -->
  <path d="M170,200 L200,180 L230,200" fill="none" stroke="#444" stroke-width="2"/>
  <path d="M175,210 L200,192 L225,210" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- Borde delantero -->
  <path d="M90,245 L200,285 L310,245" fill="none" stroke="#444" stroke-width="2"/>
</svg>
