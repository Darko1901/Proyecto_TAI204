<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fce4e4"/><stop offset="100%" style="stop-color:#f8d7d7"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>
  <!-- Sensor CKP / Crankshaft position sensor -->
  <!-- Cuerpo cilíndrico -->
  <rect x="155" y="150" width="90" height="45" rx="22" fill="#444" stroke="#333" stroke-width="2"/>
  <!-- Brida de montaje -->
  <rect x="140" y="195" width="120" height="15" rx="3" fill="#666" stroke="#555" stroke-width="1.5"/>
  <circle cx="150" cy="202" r="5" fill="#888" stroke="#777" stroke-width="1"/>
  <circle cx="250" cy="202" r="5" fill="#888" stroke="#777" stroke-width="1"/>
  <!-- Punta sensora -->
  <rect x="180" y="210" width="40" height="50" rx="4" fill="#555" stroke="#444" stroke-width="1.5"/>
  <rect x="190" y="260" width="20" height="15" rx="10" fill="#666"/>
  <!-- Conector -->
  <rect x="175" y="115" width="50" height="35" rx="5" fill="#555" stroke="#444" stroke-width="1.5"/>
  <!-- Cable -->
  <path d="M200,115 L200,85 Q200,70 220,70 L300,70" fill="none" stroke="#333" stroke-width="4"/>
  <!-- Conector hembra -->
  <rect x="300" y="60" width="35" height="22" rx="4" fill="#444"/>
  <rect x="310" y="65" width="6" height="4" fill="#888"/>
  <rect x="310" y="73" width="6" height="4" fill="#888"/>
  <rect x="320" y="65" width="6" height="4" fill="#888"/>
</svg>
