<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autopartes MACUIN - Mi Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="dashboard-container">

    <header class="dashboard-header">
        <h1>Autopartes MACUIN</h1>
        <div class="user-info">
            <span>Mi Perfil</span>
            <a href="{{ url_for('dashboard') }}" class="btn-logout">
                Volver
            </a>
        </div>
    </header>

    <main class="dashboard-content">

        <h2>Actualizar Información Personal</h2>


        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        
        <div class="card">

            <form method="POST">

                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" name="nombre" value="{{ usuario.nombre }}" required>
                </div>

                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" value="{{ usuario.correo }}" required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" name="telefono" value="{{ usuario.telefono }}" required>
                </div>

                <button type="submit" name="guardar_datos" class="btn-login">
                    Guardar Cambios
                </button>

            </form>

        </div>

        
        <div class="card" style="margin-top:30px;">

            <h3 style="color:#e57373; margin-bottom:20px;">
                Cambiar Contraseña
            </h3>

            <form method="POST">

                <div class="form-group">
                    <label>Contraseña Actual</label>
                    <input type="password" name="actual" required>
                </div>

                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" name="nueva" required>
                </div>

                <div class="form-group">
                    <label>Confirmar Nueva Contraseña</label>
                    <input type="password" name="confirmar" required>
                </div>

                <button type="submit" name="cambiar_password" class="btn-login">
                    Actualizar Contraseña
                </button>

            </form>

        </div>

    </main>

</div>

</body>
</html>
