<!DOCTYPE html>
<html>
<head>
    <title>{{ producto.nombre }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Carrito flotante */
        .carrito-flotante {
            position: fixed;
            top: 90px;
            right: 30px;
            font-size: 26px;
            background-color: #e57373;
            color: white;
            padding: 12px 16px;
            border-radius: 50%;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s ease;
            z-index: 1000;
        }

        .carrito-flotante:hover {
            background-color: #ef5350;
            transform: scale(1.1);
        }

        /* Botones */
        .btn-comprar {
            background-color: #ff9800;
            color: white;
            padding: 15px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-comprar:hover {
            background-color: #f57c00;
        }

        .dashboard-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .dashboard-cards .card {
            width: 180px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .card img {
            border-radius: 4px;
        }

        .opiniones .card {
            margin-bottom: 10px;
        }

        textarea {
            resize: none;
        }
    </style>
</head>
<body>


<a href="{{ url_for('ver_carrito') }}" class="carrito-flotante">🛒</a>

<div class="dashboard-container">

<header class="dashboard-header">
    <h1>MACUIN</h1>
    <div class="user-info">
        <a href="{{ url_for('catalogo') }}" class="btn-logout">Volver</a>
    </div>
</header>

<main class="dashboard-content">


    <div style="margin-top:20px;">
        <a href="{{ url_for('agregar_carrito', id=producto.id) }}"
           class="btn-login"
           style="display:block; text-align:center; margin-bottom:10px;">
            Agregar al carrito
        </a>

        <a href="{{ url_for('ver_carrito') }}"
           class="btn-comprar"
           style="display:block; text-align:center;">
            Comprar ahora
        </a>
    </div>

    
    <hr style="margin:40px 0;">
    <h3>Productos relacionados</h3>
    <div class="dashboard-cards">
        {% for p in productos %}
            {% if p.id != producto.id %}
            <div class="card">
                <img src="{{ url_for('static', filename='img/' + p.imagen) }}"
                     style="width:100%; height:150px; object-fit:contain;">
                <h4>{{ p.nombre }}</h4>
                <p>$ {{ p.precio }} MXN</p>
                <a href="{{ url_for('detalle_producto', id=p.id) }}"
                   class="btn-login"
                   style="display:block; text-align:center; margin-top:10px;">
                   Ver producto
                </a>
            </div>
            {% endif %}
        {% endfor %}
    </div>


 <div class="opiniones">
    {% for op in opiniones %}
    <div class="card">
        <p><strong>{{ op.usuario }}:</strong> {{ op.texto }}</p>
    </div>
    {% endfor %}
    <div class="card">
        <form method="POST">
            <label>Escribe tu opinión:</label>
            <textarea name="opinion" style="width:100%; padding:10px;"></textarea>
            <button class="btn-login" style="margin-top:10px;">Publicar opinión</button>
        </form>
    </div>
</div>

</main>
</div>

</body>
</html>
