<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - MACUIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="margin: 0;">

    <div class="login-wrapper">
        <div class="login-left">
            <div class="brand-title">
                <span>Autopartes</span><br>
                <strong>MACUIN</strong>
            </div>

            <div style="margin-bottom: 25px;">
                <h3 style="color: #333; margin-bottom: 10px;">Recuperar acceso</h3>
                <p style="color: #666; font-size: 0.9rem;">Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.</p>
            </div>

            <form action="#" method="POST" onsubmit="alert('Enlace de recuperación enviado al correo.'); return false;">
                <div class="form-group-login">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="ejemplo@macuin.com" required>
                </div>
                
                <button type="submit" class="btn-submit-login">Enviar enlace</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <a href="{{ url_for('auth.login_personal_interno') }}" style="color: #666; text-decoration: none; font-size: 0.9rem;">
                        <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                    </a>
                </div>
            </form>
        </div>

        <div class="login-right">
            <div class="anim-scene">
                <div class="light-sweep"></div>
                <div class="grid-overlay"></div>
                <div class="gear gear-1">

                    </svg>
                </div>
                <div class="gear gear-2">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M43.3,0H56.7L59,12.2C62.6,13.2,66,14.8,69,17L81,11.7L90.3,21L85,33C87.2,36,88.8,39.4,89.8,43L102,45.3V58.7L89.8,61C88.8,64.6,87.2,68,85,71L90.3,83L81,92.3L69,87C66,89.2,62.6,90.8,59,91.8L56.7,104H43.3L41,91.8C37.4,90.8,34,89.2,31,87L19,92.3L9.7,83L15,71C12.8,68,11.2,64.6,10.2,61L-2,58.7V45.3L10.2,43C11.2,39.4,12.8,36,15,33L9.7,21L19,11.7L31,17C34,14.8,37.4,13.2,41,12.2L43.3,0ZM50,35A15,15,0,1,0,65,50A15,15,0,0,0,50,35Z" fill="rgba(255,255,255,0.04)"/>
                    </svg>
                </div>
                <div class="gear gear-3">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M43.3,0H56.7L59,12.2C62.6,13.2,66,14.8,69,17L81,11.7L90.3,21L85,33C87.2,36,88.8,39.4,89.8,43L102,45.3V58.7L89.8,61C88.8,64.6,87.2,68,85,71L90.3,83L81,92.3L69,87C66,89.2,62.6,90.8,59,91.8L56.7,104H43.3L41,91.8C37.4,90.8,34,89.2,31,87L19,92.3L9.7,83L15,71C12.8,68,11.2,64.6,10.2,61L-2,58.7V45.3L10.2,43C11.2,39.4,12.8,36,15,33L9.7,21L19,11.7L31,17C34,14.8,37.4,13.2,41,12.2L43.3,0ZM50,35A15,15,0,1,0,65,50A15,15,0,0,0,50,35Z" fill="rgba(255,255,255,0.05)"/>
                    </svg>
                </div>
                <div class="particle p1"></div><div class="particle p2"></div>
                <div class="particle p3"></div><div class="particle p4"></div>
                <div class="particle p5"></div><div class="particle p6"></div>
                <div class="icon-wrench"><i class="fas fa-wrench"></i></div>
                <div class="right-content">
                    <div class="brand-badge"><i class="fas fa-lock"></i> Recuperar Acceso</div>
                    <h2>Sin<br>Contraseña,<br>Sin Problema</h2>
                    <p>Te ayudamos a recuperar tu cuenta.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
