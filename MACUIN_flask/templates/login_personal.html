<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - MACUIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="margin: 0;">

    <div class="login-wrapper">
        <div class="login-left">
            <div class="brand-title">
                <span>Autopartes</span><br>
                <strong>MACUIN</strong>
            </div>

            <div class="menu-options">
                <div style="font-weight: 500;">Inicio de sesión</div>
                <div style="color: #666;">Personal</div>
                <div style="color: #666;">Empresarial</div>
            </div>

            {% with messages = get_flashed_messages(category_filter=["error"]) %}
                {% if messages %}
                    <div class="alert-error">
                        {% for message in messages %} {{ message }} {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login_personal_interno') }}" method="POST">
                <div class="form-group-login">
                    <label>Usuario</label>
                    <input type="email" name="usuario" placeholder="usuario@macuin.com" required>
                </div>
                
                <div class="form-group-login">
                    <label>Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="input-pass" name="contrasena" placeholder="••••••••" required>
                        <i class="fas fa-eye-slash" id="icon-eye" onclick="togglePassword()"></i>
                    </div>
                    <a href="{{ url_for('recuperar') }}" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit-login">Iniciar sesión</button>
            </form>
        </div>

        <div class="login-right"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
