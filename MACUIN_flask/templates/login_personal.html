<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autopartes MACUIN - Inicio de sesión Personal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo-section">
                <h1>Autopartes<br>MACUIN</h1>
            </div>
            
            <div class="login-section">
                <h2>Inicio de sesión<br>Personal<br>Empresarial</h2>
                
                <form method="POST" action="{{ url_for('login_personal_interno') }}">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" id="contrasena" name="contrasena" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('contrasena')">
                                <i class="fas fa-eye-slash eye-icon"></i>
                            </button>
                        </div>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <button type="submit" class="btn-login">Iniciar sesión</button>
                </form>
            </div>
        </div>
        
        <div class="right-panel">
            <!-- Espacio para imagen o diseño -->
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
